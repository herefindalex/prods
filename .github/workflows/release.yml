name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web/ui install --frozen-lockfile

      - name: Verify dependency license policy
        run: python3 scripts/check-license-policy.py

      - name: Validate tagged source
        run: |
          pnpm --dir web/ui typecheck
          pnpm --dir web/ui test
          go test ./... -count=1
          go test -tags poc ./... -count=1 -timeout=5m
          go vet ./...

      - name: Build release payload
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "$GITHUB_REF_NAME"
          ./scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Verify release checksums
        run: |
          cd "dist/$GITHUB_REF_NAME"
          sha256sum --check SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: prods-${{ github.ref_name }}
          path: dist/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            "dist/$GITHUB_REF_NAME/"*
            --verify-tag
            --generate-notes
            --title "Prods $GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
