name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web/ui install --frozen-lockfile

      - name: Verify dependency license policy
        run: python3 scripts/check-license-policy.py

      - name: Validate frontend
        run: |
          pnpm --dir web/ui typecheck
          pnpm --dir web/ui test
          pnpm --dir web/ui build

      - name: Verify embedded frontend is current
        run: git diff --exit-code

      - name: Test Go packages
        run: |
          go test ./... -count=1
          go test -tags poc ./... -count=1 -timeout=5m
          go vet ./...

      - name: Verify release-bound sample data
        run: |
          sample_dir="$(mktemp -d)"
          version="$(tr -d '\r\n' < VERSION)"
          go run ./cmd/prods-sample \
            -release-version "$version" \
            -output "$sample_dir/prods-sample-data-v1.json"
          cp sample-data/schema-v1.json "$sample_dir/schema-v1.json"
          (
            cd "$sample_dir"
            sha256sum prods-sample-data-v1.json schema-v1.json > prods-sample-data-v1.json.sha256
          )
          cmp "$sample_dir/prods-sample-data-v1.json" sample-data/prods-sample-data-v1.json
          cmp "$sample_dir/prods-sample-data-v1.json.sha256" sample-data/prods-sample-data-v1.json.sha256
          cmp "$sample_dir/schema-v1.json" sample-data/schema-v1.json
          python3 - "$sample_dir/prods-sample-data-v1.json" "$version" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              payload = json.load(source)
          assert payload["schema_version"] == 1
          assert payload["release_version"] == sys.argv[2]
          assert len(payload["dictionaries"]) == 64
          assert len(payload["categories"]) == 58
          assert len(payload["specs"]) == 34
          assert len(payload["spec_sets"]) == 24
          assert len(payload["category_spec_sets"]) == 58
          assert len(payload["products"]) == 1200
          assert sum(len(product.get("spec_values", [])) for product in payload["products"]) == 4834
          PY

      - name: Cross-build release binaries
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          version="$(tr -d '\r\n' < VERSION)"
          build_flags="-s -w -X main.applicationVersion=$version -X main.sourceRevision=$SOURCE_REVISION"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$build_flags" \
            -o artifacts/prods-linux-amd64 ./cmd/prods
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$build_flags" \
            -o artifacts/prods-windows-amd64.exe ./cmd/prods
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -trimpath -ldflags "$build_flags" \
            -o artifacts/prods-darwin-amd64 ./cmd/prods
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$build_flags" \
            -o artifacts/prods-darwin-arm64 ./cmd/prods
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload cross-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prods-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
